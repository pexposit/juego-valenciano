# Desplegament complet en un servidor propi: web + API + Supabase (Postgres,
# Auth i REST) darrere de Caddy, amb HTTPS automàtic.
#   cp .env.deploy.example .env && node deploy/generate-secrets.mjs >> .env
#   docker compose up -d --build
# Secrets del backend que no són de Supabase (OpenAI...) a backend/.env.
# Claus compartides (OPENAI_API_KEY, TYPESAFE_API_KEY): UNA sola còpia, en el .env de l'arrel; el compose les passa només
# als servicis que les usen (api i rag). Variables pròpies de cada servici: backend/.env, rag_gnv/.env i mcp/.env (opcionals).
#
# Este compose és el DESPLEGAMENT complet. El projecte es diu `parlaval-deploy` i els contenidors
# `parlaval-deploy-*`, perquè en Docker Desktop no es mesclen amb els de desenvolupament: `supabase start`
# crea `supabase_*_juego-valenciano` i `npm run dev` no usa contenidors (només la base de dades local).
name: parlaval-deploy

x-deploy-labels: &deploy-labels
  com.parlaval.stack: deploy

services:
  web:
    container_name: parlaval-deploy-web
    labels: *deploy-labels
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_SUPABASE_URL: https://${DOMAIN:?cal definir DOMAIN}
        VITE_SUPABASE_ANON_KEY: ${ANON_KEY:?cal definir ANON_KEY (deploy/generate-secrets.mjs)}
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # Entrada :8000 (auth+rest sota un mateix origen, com Kong) publicada
      # només a 127.0.0.1: per a apuntar-hi el frontend/backend en dev sense
      # passar pel domini/HTTPS. No cal en un desplegament real.
      - "127.0.0.1:8000:8000"
    volumes:
      # Certificats de Let's Encrypt: sense volum es tornarien a demanar a cada
      # reinici i es podria topar amb el límit de peticions.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - auth
      - rest
    restart: unless-stopped

  api:
    container_name: parlaval-deploy-api
    labels: *deploy-labels
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      PORT: 3001
      # El navegador envia Origin també en POST del mateix origen.
      FRONTEND_ORIGIN: https://${DOMAIN}
      # Per la xarxa interna, a través de l'entrada :8000 de Caddy.
      SUPABASE_URL: http://web:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?cal definir SERVICE_ROLE_KEY}
      # Servidor MCP lingüístic (servici `mcp`): analitzador d'errors, avaluadors d'escriptura i conjugació.
      MCP_URL: http://mcp:3002/mcp
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      # RAG de la GNV (servici `rag`). Sense dependència: si no respon, el tutor contesta igual, sense la regla.
      RAG_GNV_URL: http://rag:8010
      # Claves compartides: una sola còpia, en el .env de l'arrel (la mateixa que el RAG). Manen sobre backend/.env.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?cal definir OPENAI_API_KEY en el .env de l'arrel}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mcp:
        condition: service_healthy
    # Sense `ports`: només és accessible des de Caddy, dins de la xarxa de compose.
    restart: unless-stopped

  # Servidor MCP lingüístic (DNV, conjugació, Apertium i SoftValència) per HTTP: el backend el crida per la xarxa
  # interna. Sense `ports` ni ruta a Caddy. Les seues variables, a mcp/.env (opcional: tot té valor per defecte).
  mcp:
    container_name: parlaval-deploy-mcp
    labels: *deploy-labels
    build:
      context: .
      dockerfile: mcp/Dockerfile
    env_file:
      - path: mcp/.env
        required: false
    environment:
      PORT: 3002
      # El mateix token ací i en l'API (buit = sense token; el servici només és accessible dins de la xarxa de compose).
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
    restart: unless-stopped

  # RAG de la Gramàtica Normativa Valenciana (rag_gnv/): el tutor el consulta per als dubtes de normativa i per a triar
  # exercicis. Només CPU. Sense `ports`. Les claus (OPENAI_API_KEY per als embeddings i
  # TYPESAFE_API_KEY per al reranker Jev) vénen del .env de l'arrel; les altres variables, a rag_gnv/.env. L'índex es genera sol en el primer arranc i es guarda en el volum `rag_index`.
  rag:
    container_name: parlaval-deploy-rag
    labels: *deploy-labels
    build:
      context: .
      dockerfile: rag_gnv/Dockerfile
    env_file:
      - path: rag_gnv/.env
        required: false
    environment:
      # Claus compartides amb l'API: una sola còpia, en el .env de l'arrel.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?cal definir OPENAI_API_KEY en el .env de l'arrel}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    volumes:
      - rag_index:/app/rag_gnv/index_gnv
      - rag_models:/home/app/.cache/huggingface
    # Sense claus (rag_gnv/.env) el RAG no arranca: es reintenta unes voltes i para, en lloc de fer bucle indefinidament.
    restart: on-failure:5

  # --- Supabase autoallotjat: només els serveis que usa l'app ---------------
  # Versions fixades segons el docker-compose oficial de supabase/supabase.

  db:
    container_name: parlaval-deploy-db
    labels: *deploy-labels
    image: supabase/postgres:17.6.1.136
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      PGPORT: 5432
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?cal definir POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - ./deploy/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - db_data:/var/lib/postgresql/data
      # Clau de pgsodium: ha de persistir amb les dades.
      - db_config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth:
    container_name: parlaval-deploy-auth
    labels: *deploy-labels
    image: supabase/gotrue:v2.196.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://${DOMAIN}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: https://${DOMAIN}
      GOTRUE_URI_ALLOW_LIST: https://${DOMAIN}/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?cal definir JWT_SECRET}
      GOTRUE_JWT_ISSUER: https://${DOMAIN}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      # true = alta sense correu de confirmació (igual que en local). Per a
      # confirmar per correu, posa-ho a false i ompli les SMTP_* del .env.
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-true}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-ParlaVal}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Aplica supabase/migrations quan GoTrue ja ha creat l'esquema auth, i acaba.
  migrate:
    container_name: parlaval-deploy-migrate
    labels: *deploy-labels
    image: supabase/postgres:17.6.1.136
    depends_on:
      auth:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./deploy/db/migrate.sh:/migrate.sh:ro
      - ./deploy/db/squash-map.txt:/squash-map.txt:ro
    entrypoint: ["sh", "/migrate.sh"]
    restart: "no"

  rest:
    container_name: parlaval-deploy-rest
    labels: *deploy-labels
    image: postgrest/postgrest:v14.17
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: 1000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  db_data:
  db_config:
  rag_index:
  rag_models:
